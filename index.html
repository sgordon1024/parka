<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parka · first designs</title>
<link rel="stylesheet" href="baseline/styles.css">
<style>
  body { margin: 0; background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font-body); }
  header { max-width: 1280px; margin: 0 auto; padding: var(--space-12) var(--space-6) var(--space-8);
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-4) var(--space-8); }
  .intro { flex: 1 1 520px; }
  .eyebrow { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--text-tertiary); margin: 0; }
  h1 { font-family: var(--font-display); font-size: var(--text-4xl); letter-spacing: -0.04em; line-height: 1;
    margin: var(--space-2) 0 var(--space-3); }
  .sub { margin: 0; max-width: 62ch; color: var(--text-secondary); font-size: var(--text-base);
    line-height: var(--leading-relaxed); }
  .seg { display: inline-flex; background: var(--surface-sunken); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-full); padding: 3px; }
  .seg button { font: inherit; font-size: var(--text-xs); border: 0; background: none; color: var(--text-secondary);
    min-height: 36px; padding: 0 16px; border-radius: var(--radius-full); cursor: pointer; }
  .seg button.on { background: var(--surface-raised); color: var(--text-primary); box-shadow: var(--shadow-xs); font-weight: 600; }
  .seg button:focus-visible { outline: 2px solid var(--accent-default); outline-offset: 1px; }
  .frames { max-width: 1280px; margin: 0 auto; padding: 0 var(--space-6) var(--space-8);
    display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-6); }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  iframe { width: 390px; height: 844px; border: 1px solid var(--border-default); border-radius: 44px;
    background: var(--bg-primary); box-shadow: var(--shadow-lg); }
  figcaption { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--tracking-wide);
    text-transform: uppercase; color: var(--text-tertiary); }
  footer { padding: 0 var(--space-6) var(--space-12); text-align: center; color: var(--text-tertiary); font-size: var(--text-xs); }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <div class="intro">
    <p class="eyebrow">Parka · first designs</p>
    <h1>What to wear, from the live forecast.</h1>
    <p class="sub">Three phone screens in real code, built on the Baseline design system. The weather is live,
      so the screens update with the real forecast.</p>
  </div>
  <div class="seg" role="group" aria-label="Fidelity">
    <button type="button" data-v="wire">Lo-fi</button>
    <button type="button" data-v="" class="on">Branded</button>
  </div>
</header>
<section class="frames">
  <figure><iframe src="today.html" title="Today screen"></iframe><figcaption>Today</figcaption></figure>
  <figure><iframe src="week.html" title="Week screen"></iframe><figcaption>Week</figcaption></figure>
  <figure><iframe src="places.html" title="Places screen"></iframe><figcaption>Places</figcaption></figure>
</section>
<footer>A made-up app with real data. Weather by <a href="https://open-meteo.com/">Open-Meteo.com</a>.
  Built with Claude on Baseline.</footer>
<script>
  // Baseline's fidelity axis: data-fidelity="wire" turns the brand to neutral without rebuilding anything.
  const frames = [...document.querySelectorAll("iframe")];
  let fidelity = "";
  function apply(frame) {
    const root = frame.contentDocument && frame.contentDocument.documentElement;
    if (!root) return;
    if (fidelity) root.setAttribute("data-fidelity", fidelity);
    else root.removeAttribute("data-fidelity");
  }
  frames.forEach((f) => f.addEventListener("load", () => apply(f)));
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    fidelity = b.dataset.v;
    document.querySelectorAll(".seg button").forEach((x) => x.classList.toggle("on", x === b));
    frames.forEach(apply);
  }));
</script>
</body>
</html>
